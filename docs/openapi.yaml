paths:
  /api/market:
    get:
      summary: Top 50 coins by market cap with a 7-day sparkline
      description: "Served from the shared cache; the provider is called at most once
        per TTL (15 min). `Cache-Control: s-maxage` equals the seconds until
        `nextRefreshAt`."
      tags:
        - market
      responses:
        "200":
          description: Fresh or stale data. Stale responses carry the original `fetchedAt`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEnvelope"
        "429":
          description: Rate limited (per hashed IP). Retry after `Retry-After` seconds.
        "503":
          description: No cached data and no provider can be called (budget, breaker or
            outage).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketEnvelope"
  /api/fx:
    get:
      summary: Latest USD exchange rates
      description: Frankfurter (ECB reference rates, TTL 6 h); ExchangeRate-API serves
        as the backup and is named in `source` when it was used.
      tags:
        - fx
      responses:
        "200":
          description: Fresh or stale rates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxEnvelope"
        "429":
          description: Rate limited (per hashed IP). Retry after `Retry-After` seconds.
        "503":
          description: No cached data and no provider can be called (budget, breaker or
            outage).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxEnvelope"
  /api/coins/{id}/chart:
    get:
      summary: Price history for a whitelisted coin
      description: 1d and 30d share the hourly 30-day series (TTL 6 h); 1y is daily
        (TTL 24 h); 7d comes from the top-50 sparkline at no extra provider
        cost. Parameters are validated against the whitelist before any cache or
        provider access.
      tags:
        - market
      parameters:
        - schema:
            type: string
            enum:
              - bitcoin
              - ethereum
              - tether
              - binancecoin
              - ripple
              - usd-coin
              - solana
              - tron
              - figure-heloc
              - zcash
            example: bitcoin
          required: true
          name: id
          in: path
        - schema:
            type: string
            enum:
              - 1d
              - 7d
              - 30d
              - 1y
            example: 30d
          required: false
          name: range
          in: query
      responses:
        "200":
          description: Fresh or stale series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartEnvelope"
        "400":
          description: Malformed id or unknown range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Coin is not on the whitelist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (per hashed IP). Retry after `Retry-After` seconds.
        "503":
          description: No cached data and no provider can be called (budget, breaker or
            outage).
          headers:
            Retry-After:
              schema:
