version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      testing:
        patterns:
          ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/test", "@axe-core/*"]
      lint:
        patterns: ["eslint", "eslint-*", "prettier", "prettier-*", "@commitlint/*"]
    ignore:
      # Types follow the Node runtime major (24 LTS), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) waits for typescript-eslint and Next.js support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node LTS line used by Vercel; odd majors are not LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
