version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      testing:
        patterns:
          ["vitest", "@vitest/*", "@testing-library/*", "msw", "@playwright/test", "@axe-core/*"]
      lint:
        patterns: ["eslint", "eslint-*", "prettier", "prettier-*", "@commitlint/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
