# Local Redis for integration tests. Optional full-stack run: `docker compose --profile app up`.
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Upstash-compatible REST proxy in front of local Redis, so local and CI use the same
  # protocol as production. KV_REST_API_URL=http://localhost:8079  KV_REST_API_TOKEN=local-dev-token
  redis-http:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-dev-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"
    depends_on:
      redis:
        condition: service_healthy

  app:
    profiles: ["app"]
    build: .
    env_file: .env.local
    environment:
      MOCK_PROVIDERS: "1"
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
